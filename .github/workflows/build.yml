name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Utwórz wydanie v<versionName> z tego commita"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Klucz do podpisu z sekretow repo (jesli sa); bez nich APK podpisze klucz debug
      - name: Przygotuj klucz do podpisu
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DYMEK_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Zbuduj APK
        env:
          DYMEK_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DYMEK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DYMEK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk dymek.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dymek-apk
          path: dymek.apk

      # tag z pushu albo, przy recznym uruchomieniu z "release", z wersji aplikacji na tym commicie;
      # wydanie utworzone wczesniej (np. na stronie GitHuba) dostaje tylko nowy APK
      - name: Wydanie
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dymek.apk --clobber
          else
            gh release create "$TAG" dymek.apk --target "$GITHUB_SHA" --title "Dymek $TAG" --generate-notes
          fi
