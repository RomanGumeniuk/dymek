name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Utwórz wydanie v<versionName> z tego commita"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Klucz do podpisu z sekretow repo (jesli sa); bez nich APK podpisze klucz debug
      - name: Przygotuj klucz do podpisu
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DYMEK_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Zbuduj APK
        env:
          DYMEK_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DYMEK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DYMEK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk dymek.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dymek-apk
          path: dymek.apk

      - name: Wydanie
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # wydanie razem z tagiem mozna tez utworzyc na stronie GitHuba; wtedy tylko dokladamy do niego APK
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dymek.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dymek.apk --title "Dymek $GITHUB_REF_NAME" --generate-notes
          fi

      # reczne uruchomienie z zaznaczonym "release": tag z wersji aplikacji na tym commicie
      - name: Wydanie z recznego uruchomienia
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          gh release create "v$VERSION" dymek.apk --target "$GITHUB_SHA" --title "Dymek v$VERSION" --generate-notes
